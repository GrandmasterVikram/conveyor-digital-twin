<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

    <title>Unity Web Player | Conveyor belt project</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #unity-fullscreen-container {
        position: relative;
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
        border: 0;
      }

      #unity-loading-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }

      #unity-warning {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        z-index: 100;
      }

      #unity-footer {
        display: none;
      }
    </style>
  </head>

  <body>

    <div id="unity-container" class="unity-desktop">

      <div id="unity-fullscreen-container">

        <canvas
          id="unity-canvas"
          width="960"
          height="600"
          tabindex="-1">
        </canvas>

        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>

      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Conveyor belt project</div>
      </div>

    </div>


    <script>

      let canvas = document.querySelector("#unity-canvas");

      let fullscreenContainer =
        document.querySelector("#unity-fullscreen-container");


      function unityShowBanner(msg, type) {

        var warningBanner =
          document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");

        div.innerHTML = msg;

        warningBanner.appendChild(div);

        if (type == "error") {

          div.style =
            "background: red; padding: 10px;";

        } else {

          if (type == "warning") {

            div.style =
              "background: yellow; padding: 10px;";

          }

          setTimeout(function() {

            if (div.parentNode) {
              warningBanner.removeChild(div);
            }

            updateBannerVisibility();

          }, 5000);
        }

        updateBannerVisibility();
      }


      var buildUrl = "Build";

      var loaderUrl =
        buildUrl + "/UnityWebGLBuild3.loader.js";


      var config = {

        arguments: [],

        dataUrl:
          buildUrl + "/UnityWebGLBuild3.data",

        frameworkUrl:
          buildUrl + "/UnityWebGLBuild3.framework.js",

        codeUrl:
          buildUrl + "/UnityWebGLBuild3.wasm",

        streamingAssetsUrl:
          "StreamingAssets",

        fullscreenElementID:
          "unity-fullscreen-container",

        companyName:
          "DefaultCompany",

        productName:
          "Conveyor belt project",

        productVersion:
          "0.1.0",

        showBanner:
          unityShowBanner
      };


      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

        var meta =
          document.createElement("meta");

        meta.name = "viewport";

        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

        document
          .getElementsByTagName("head")[0]
          .appendChild(meta);

        document.querySelector("#unity-container")
          .className = "unity-mobile";

        canvas.className = "unity-mobile";


      } else {

        /*
         * IMPORTANT:
         * Do NOT use fixed 960x600 here.
         * The Unity canvas must follow the iframe size.
         */

        fullscreenContainer.style.width = "100%";
        fullscreenContainer.style.height = "100%";

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }


      var script =
        document.createElement("script");

      script.src = loaderUrl;


      script.onload = () => {

        const loadingContainer =
          document.querySelector(
            "#unity-loading-container"
          );

        const progressBarFull =
          document.querySelector(
            "#unity-progress-bar-full"
          );


        createUnityInstance(
          canvas,
          config,
          (progress) => {

            if (progress < 1) {

              loadingContainer.style.display =
                "block";

              progressBarFull.style.width =
                100 * progress + "%";

            } else {

              loadingContainer.style.display =
                "none";
            }

          }

        ).then((unityInstance) => {

          const fullscreenButton =
            document.querySelector(
              "#unity-fullscreen-button"
            );

          if (fullscreenButton) {

            fullscreenButton.onclick = () => {

              unityInstance.SetFullscreen(1);

            };
          }

        }).catch((message) => {

          alert(message);

        });

      };


      document.body.appendChild(script);

    </script>

  </body>
</html>
